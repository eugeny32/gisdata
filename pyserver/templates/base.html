<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GNSS Мониторинг{% endblock %}</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2f6fed">
  <link rel="icon" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-bs-theme', saved === 'light' ? 'light' : 'dark');
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</head>
<body>
<div class="app-shell">
  <div id="sidebarBackdrop"></div>
  {% include "partials/sidebar.html" %}
  <div class="app-content">
    <header class="topbar">
      <button class="btn btn-sm btn-outline-secondary" type="button" id="sidebarToggle" title="Свернуть/развернуть меню">
        <i class="bi bi-list"></i>
      </button>
      <span class="spacer"></span>
      <button class="btn btn-sm btn-outline-secondary" type="button" id="themeToggle" title="Светлая/тёмная тема">
        <i class="bi bi-moon-stars"></i>
      </button>
      {% if nav_admin %}
        <span class="text-secondary small ms-2 d-none d-sm-inline text-truncate" style="max-width:160px"><i class="bi bi-shield-lock me-1"></i>{{ nav_admin.login }}</span>
        <a class="btn btn-sm btn-outline-light ms-2" href="{% url 'logout' %}">Выход</a>
      {% elif nav_user %}
        <span class="text-secondary small ms-2 d-none d-sm-inline text-truncate" style="max-width:130px"><i class="bi bi-person me-1"></i>{{ nav_user.user_name }}</span>
        <a class="btn btn-sm btn-outline-secondary ms-2 d-none d-sm-inline-flex" href="{% url 'admin_login' %}">Вход суперпользователя</a>
        <a class="btn btn-sm btn-outline-light ms-2" href="{% url 'logout' %}">Выход</a>
      {% endif %}
    </header>
    <main class="page-main">
      <h1 class="page-title h4"><i class="bi {% block page_icon %}bi-house{% endblock %} text-primary"></i>{% block page_title %}{% endblock %}</h1>
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function () {
    var html = document.documentElement;
    var icon = document.querySelector('#themeToggle i');
    function syncIcon() {
      if (!icon) return;
      icon.className = html.getAttribute('data-bs-theme') === 'light' ? 'bi bi-sun' : 'bi bi-moon-stars';
    }
    syncIcon();
    var themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var next = html.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
        html.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
        syncIcon();
      });
    }
    var toggleBtn = document.getElementById('sidebarToggle');
    var sidebar = document.getElementById('sidebar');
    var backdrop = document.getElementById('sidebarBackdrop');
    function closeSidebar() {
      if (!sidebar) return;
      sidebar.classList.remove('sidebar-open');
      if (backdrop) backdrop.classList.remove('show');
      document.body.style.overflow = '';
    }
    try {
      if (sidebar && window.innerWidth >= 992 && localStorage.getItem('sidebarCollapsed') === '1') {
        sidebar.classList.add('sidebar-collapsed');
      }
    } catch (e) {}
    if (toggleBtn && sidebar) {
      toggleBtn.addEventListener('click', function () {
        if (window.innerWidth >= 992) {
          var collapsed = sidebar.classList.toggle('sidebar-collapsed');
          try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}
          return;
        }
        var isOpen = sidebar.classList.toggle('sidebar-open');
        if (backdrop) backdrop.classList.toggle('show', isOpen);
        document.body.style.overflow = isOpen ? 'hidden' : '';
      });
    }
    if (backdrop) backdrop.addEventListener('click', closeSidebar);
    if (sidebar) {
      sidebar.querySelectorAll('.sidebar-link').forEach(function (link) {
        link.addEventListener('click', function () {
          if (window.innerWidth < 992) closeSidebar();
        });
      });
    }
  })();
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
