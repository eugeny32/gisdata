{% extends "base.html" %}
{% block title %}Загрузка документа{% endblock %}
{% block page_icon %}bi-upload{% endblock %}
{% block page_title %}Загрузка документа{% endblock %}
{% block content %}
  <div class="card surface-card" style="max-width: 720px;">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small">Название</label>
          <input type="text" name="title" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Описание</label>
          <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label small">Категория</label>
          <select name="category" class="form-select">
            <option value="">—</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small">Файл</label>
          <input type="file" name="file" class="form-control" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Загрузить</button>
          <a href="{% url 'documents:list' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
