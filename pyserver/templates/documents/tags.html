{% extends "base.html" %}
{% block title %}Теги{% endblock %}
{% block page_icon %}bi-tags{% endblock %}
{% block page_title %}Теги{% endblock %}
{% block content %}
  <div class="card surface-card">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h6 mb-0">Все теги</h2>
        <a href="{% url 'documents:list' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-folder2-open"></i> Все документы</a>
      </div>
      <div class="d-flex flex-wrap gap-2">
        {% for tag in tags %}
          <a href="{% url 'documents:list' %}?tag={{ tag.name }}" class="badge text-bg-secondary text-decoration-none">{{ tag.name }}</a>
        {% empty %}
          <span class="text-muted">Нет тегов</span>
        {% endfor %}
      </div>
    </div>
  </div>
{% endblock %}
