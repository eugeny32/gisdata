<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Чат{% endblock %} — GISData</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { min-height: 100vh; }
  .chat-shell { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
</style>
</head>
<body>
<div class="chat-shell">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a href="{% url 'chat_home' %}" class="text-decoration-none text-white h5 mb-0"><i class="bi bi-chat-dots me-2"></i>Чат</a>
    <a href="https://ntrip.host/home/" class="ms-auto btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-left"></i> К платформе</a>
  </div>
  {% block content %}{% endblock %}
</div>
{% block extra_scripts %}{% endblock %}
</body>
</html>
